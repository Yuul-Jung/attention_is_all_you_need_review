<text x="330" y="70" font-family="'IBM Plex Sans KR','Malgun Gothic','Apple SD Gothic Neo','Noto Sans CJK KR','Noto Sans KR',sans-serif" font-size="14.5" font-weight="600" fill="#172439" text-anchor="start" dominant-baseline="middle">칸 한 쌍 (2i, 2i+1) = (sin(pos·ω), cos(pos·ω))</text>
<text x="330" y="112" font-family="'IBM Plex Sans KR','Malgun Gothic','Apple SD Gothic Neo','Noto Sans CJK KR','Noto Sans KR',sans-serif" font-size="14.5" font-weight="600" fill="#172439" text-anchor="start" dominant-baseline="middle">위치를 k 만큼 옮기기 = 같은 각도 k·ω 만큼 돌리기</text>
<text x="330" y="154" font-family="'IBM Plex Sans KR','Malgun Gothic','Apple SD Gothic Neo','Noto Sans CJK KR','Noto Sans KR',sans-serif" font-size="14.5" font-weight="600" fill="#172439" text-anchor="start" dominant-baseline="middle">돌리기는 pos 와 상관없는 고정 행렬 곱 → 선형 변환</text>
<text x="330" y="196" font-family="'IBM Plex Sans KR','Malgun Gothic','Apple SD Gothic Neo','Noto Sans CJK KR','Noto Sans KR',sans-serif" font-size="14.5" font-weight="700" fill="#4635B1" text-anchor="start" dominant-baseline="middle">그래서 모델이 &#x27;몇 칸 떨어졌나&#x27;를 배우기 쉽다고 봄</text>
